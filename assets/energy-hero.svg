<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Behnam Mohseni: smarter energy, more flexible grids</title>
  <desc id="desc">A custom energy systems illustration: an electricity pylon, a solar home, an electric vehicle and a predictive controller connected by animated power and control paths. Energy management, energy flexibility and power grids.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="800" gradientUnits="userSpaceOnUse"><stop stop-color="#0c1828"/><stop offset=".55" stop-color="#0b1722"/><stop offset="1" stop-color="#0b252b"/></linearGradient>
    <linearGradient id="mint" x1="56" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#b6f6dc"/><stop offset="1" stop-color="#56d9d0"/></linearGradient>
    <linearGradient id="roof" x1="540" y1="389" x2="714" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#21545b"/><stop offset="1" stop-color="#143338"/></linearGradient>
    <linearGradient id="wall" x1="526" y1="480" x2="690" y2="593" gradientUnits="userSpaceOnUse"><stop stop-color="#24414b"/><stop offset="1" stop-color="#112733"/></linearGradient>
    <linearGradient id="car" x1="899" y1="540" x2="1109" y2="600" gradientUnits="userSpaceOnUse"><stop stop-color="#3b6577"/><stop offset="1" stop-color="#183444"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#36d8bd" stop-opacity=".13"/><stop offset="1" stop-color="#36d8bd" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#8dc2c5" opacity=".13"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
    <style>
      text { font-family: Segoe UI, Inter, Arial, sans-serif; }
      .mono { font-family: Consolas, monospace; }
      .flow { stroke-dasharray: 7 17; animation: flow 5s linear infinite; }
      .signal { stroke-dasharray: 3 9; animation: flow 8s linear infinite reverse; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -120; } }
      @keyframes pulse { 0%,100% { opacity:.4; } 50% { opacity:1; } }
      @media (prefers-reduced-motion: reduce) { .flow,.signal,.pulse { animation:none; } }
    </style>
  </defs>
  <rect x="1" y="1" width="1278" height="798" rx="28" fill="url(#bg)" stroke="#28414d" stroke-width="2"/>
  <rect x="2" y="2" width="1276" height="796" rx="27" fill="url(#dots)"/>
  <ellipse cx="750" cy="530" rx="590" ry="310" fill="url(#aura)"/>
  <path d="M56 55h28m-14-14v28" stroke="#7de7c3" stroke-width="2"/>
  <text x="101" y="63" fill="#edf7f7" font-size="25" font-weight="600" letter-spacing="1">BEHNAM MOHSENI</text>
  <rect x="971" y="39" width="253" height="37" rx="18.5" fill="#142a32" stroke="#30534f"/>
  <circle cx="994" cy="57.5" r="4" fill="#8cf0c8" class="pulse"/>
  <text x="1010" y="63" fill="#b3d3ce" font-size="13" class="mono" letter-spacing="1.4">ENERGY SYSTEMS / CODE</text>
  <text x="56" y="151" fill="#f2f8fb" font-size="65" font-weight="650" letter-spacing="-2">Smarter energy.</text>
  <text x="56" y="227" fill="url(#mint)" font-size="65" font-weight="650" letter-spacing="-2">More flexible grids.</text>
  <text x="59" y="273" fill="#a8bdc8" font-size="22">Connecting buildings, mobility, and intelligent control.</text>

